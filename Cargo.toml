[package]
name = "cypher_agent"
version = "0.1.0"
edition = "2021"

[dependencies]
# Biblioteca oficial para chamar APIs nativas do Windows
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

# Biblioteca que encapsula a API 'ReadDirectoryChangesW' do Windows com alta performance
notify = "6.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", features = ["json", "blocking"] }
